<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مفروشات البركة</title>
</head>
<body style="font-family:Arial; background:#f5f5f5; margin:0;">

<div style="background:#333; color:white; padding:20px;">
  <h1>🛒 مفروشات البركة</h1>
</div>

<div style="padding:20px;">

<h2>📦 المنتجات</h2>

<div style="background:white; padding:15px; margin:10px; border-radius:10px;">
  <h3>🪑 مرجوحة نارا</h3>
  <p>الكود: MR-001</p>
  <button onclick="addToOrder('مرجوحة نارا - MR-001')">➕ أضف إلى الطلب</button>
</div>

<div style="background:white; padding:15px; margin:10px; border-radius:10px;">
  <h3>🍽️ طاولة زان</h3>
  <p>الكود: TZ-002</p>
  <button onclick="addToOrder('طاولة زان - TZ-002')">➕ أضف إلى الطلب</button>
</div>

<hr>

<h2>📋 الطلب الحالي</h2>
<ul id="cart"></ul>

<button onclick="sendOrder()" style="padding:10px 20px;">📤 إرسال الطلب</button>

</div>

<script>
let cart = [];

function addToOrder(item) {
  cart.push(item);
  showCart();
}

function showCart() {
  let list = document.getElementById("cart");
  list.innerHTML = "";

  cart.forEach(i => {
    let li = document.createElement("li");
    li.innerHTML = "📦 " + i;
    list.appendChild(li);
  });
}

function sendOrder() {
  if(cart.length === 0) return alert("❌ السلة فارغة");

  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  orders.push("طلب جديد: " + cart.join(" + "));

  localStorage.setItem("orders", JSON.stringify(orders));

  cart = [];
  showCart();

  alert("✅ تم إرسال الطلب");
}
</script>

</body>
</html>
