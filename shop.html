<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مفروشات البركة - المتجر</title>
</head>

<body style="font-family:Arial; background:#f5f5f5; margin:0;">

<div style="background:#333; color:white; padding:20px;">
  <h1>🛒 مفروشات البركة</h1>
</div>

<div style="padding:20px;">

<h2>📦 المنتجات</h2>

<div style="background:white; padding:15px; margin:10px; border-radius:10px;">
  <h3>🪑 مرجوحة نارا</h3>
  <p>الكود: MR-001</p>
  <button onclick="addToCart('مرجوحة نارا - MR-001')">➕ أضف للسلة</button>
</div>

<div style="background:white; padding:15px; margin:10px; border-radius:10px;">
  <h3>🍽️ طاولة زان</h3>
  <p>الكود: TZ-002</p>
  <button onclick="addToCart('طاولة زان - TZ-002')">➕ أضف للسلة</button>
</div>

<hr>

<h2>🛒 السلة</h2>
<ul id="cart"></ul>

<button onclick="sendOrder()" style="padding:10px 20px; font-size:16px;">
📤 إرسال الطلب
</button>

</div>

<script>
let cart = [];

function addToCart(item){
  cart.push(item);
  showCart();
}

function showCart(){
  let list = document.getElementById("cart");
  list.innerHTML = "";

  cart.forEach(i => {
    let li = document.createElement("li");
    li.innerHTML = "📦 " + i;
    list.appendChild(li);
  });
}

async function sendOrder(){

  if(cart.length === 0){
    alert("❌ السلة فارغة");
    return;
  }

  let name = prompt("اسم الزبون:");
  let phone = prompt("رقم الهاتف:");
  let city = prompt("المحافظة:");

  let order = {
    id: Date.now(),
    customer: name,
    phone: phone,
    city: city,
    items: cart,
    status: "جديد"
  };

  await fetch("/api/orders", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(order)
  });

  cart = [];
  showCart();

  alert("✅ تم إرسال الطلب بنجاح");
}
</script>

</body>
</html>
