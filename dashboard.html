<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لوحة الطلبات</title>
</head>

<body style="font-family:Arial; background:#f5f5f5; margin:0;">

<div style="background:#222; color:white; padding:15px;">
  <h1>📊 لوحة الطلبات - مفروشات البركة</h1>
</div>

<div style="padding:20px;">

<button onclick="loadOrders()" style="padding:10px 15px;">
🔄 تحديث الطلبات
</button>

<button onclick="clearOrders()" style="padding:10px 15px; margin-left:10px;">
🗑️ حذف كل الطلبات
</button>

<hr>

<div id="orders"></div>

</div>

<script>

async function loadOrders(){

  let res = await fetch("/api/orders");
  let data = await res.json();

  let box = document.getElementById("orders");
  box.innerHTML = "";

  if(data.length === 0){
    box.innerHTML = "<p>لا يوجد طلبات</p>";
    return;
  }

  data.forEach((o, index) => {

    let items = o.items ? o.items.join(" , ") : "";

    box.innerHTML += `
      <div style="background:white; padding:15px; margin:10px; border-radius:10px;">
        <h3>📦 طلب رقم ${index + 1}</h3>
        <p>👤 الاسم: ${o.customer || "-"}</p>
        <p>📞 الهاتف: ${o.phone || "-"}</p>
        <p>📍 المحافظة: ${o.city || "-"}</p>
        <p>🛒 الطلبات: ${items}</p>
        <p>📌 الحالة: ${o.status || "جديد"}</p>
      </div>
    `;

  });

}

async function clearOrders(){

  if(!confirm("هل تريد حذف كل الطلبات؟")) return;

  await fetch("/api/orders", {
    method: "DELETE"
  });

  loadOrders();
}

loadOrders();

</script>

</body>
</html>
